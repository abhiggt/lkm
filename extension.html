<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkmery extension</title>
<meta name="description" content="A working preview of the Linkmery browser extension: save the page you are on to a shelf, or find something already kept.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="extension/fonts.css">
<link rel="stylesheet" href="extension/ui.css">
<style>
  :root { --day: #e9e9e6; --night: #232322; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--day); color: #262624; font: 400 15px/1.5 "Linkmery Sans", "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { max-width: 820px; margin: 0 auto; padding: 56px 16px 8px; text-align: center; }
  header h1 { font: 400 clamp(28px, 4vw, 40px)/1.1 "Linkmery Serif", Fraunces, Georgia, serif; margin: 0 0 10px; }
  header p { margin: 0 auto; max-width: 520px; color: #6f6f69; }
  kbd { font: 400 12px "Linkmery Mono", ui-monospace, monospace; padding: 2px 8px; border-radius: 7px; background: var(--day); box-shadow: 2px 2px 5px #c4c4bf, -2px -2px 5px #fff; }
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); max-width: 1000px; margin: 36px auto 0; gap: 0; }
  .side { display: grid; justify-items: center; align-content: start; gap: 18px; padding: 40px 16px 56px; }
  .side.night { background: var(--night); color: #e6e6e2; border-radius: 28px 28px 0 0; }
  @media (min-width: 800px) { .side.day { border-radius: 28px 0 0 28px; } .side.night { border-radius: 28px; } }
  .side h2 { margin: 0; font: 400 12px "Linkmery Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #8d8d87; }
  .side .overlay { animation: none; max-height: none; width: min(360px, 100%); }
  .side.day .overlay { box-shadow: 12px 12px 30px #c4c4bf, -10px -10px 26px #fff; }
  .side.night .overlay { box-shadow: 12px 12px 30px rgb(0 0 0 / .6), -8px -8px 22px rgb(255 255 255 / .04); }
  footer { text-align: center; padding: 28px 16px 48px; color: #85857f; font-size: 13px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>The extension</h1>
  <p>Press <kbd>Alt</kbd> + <kbd>L</kbd> on any page to add it to your library, or to find something already kept. This preview works; nothing in it is saved.</p>
</header>
<main class="stage">
  <section class="side day"><h2>Add · day</h2><div class="overlay" data-theme="day" id="day"></div></section>
  <section class="side night"><h2>Find · night</h2><div class="overlay" data-theme="night" id="night"></div></section>
</main>
<footer><a href="./">Back to the library</a></footer>
<script type="module">
  // The panel is the extension's own code. Here its background worker is played
  // by this page: it reads the library this site publishes and pretends to save.
  const get = p => fetch(p).then(r => r.ok ? r.json() : null).catch(() => null);
  const [bm, shelves, synonyms] = await Promise.all(['data/bookmarks.json', 'data/shelves.json', 'data/synonyms.json'].map(get));
  const data = { entries: bm?.entries || [], shelves: shelves?.shelves || shelves || [], synonyms: synonyms?.synonyms || synonyms || [], config: { ownerName: 'Abhijeet' }, fetchedAt: Date.now() };
  const runtime = { sendMessage: async msg => {
    if (msg.type === 'data') return data;
    if (msg.type === 'save') return { ok: true, committed: false, entry: { ...msg.form, id: 'preview' } };
    return {};
  } };
  Object.defineProperty(window, 'chrome', { value: { runtime }, configurable: true, writable: true });
  const { renderApp } = await import('./extension/ui.js');
  const page = { url: 'https://fonts.google.com/specimen/Fraunces', title: 'Fraunces - Google Fonts',
    description: 'A soft, wonky old-style serif with optical sizes; lovely for display headings.', icon: 'favicon.svg' };
  const day = () => renderApp(document.getElementById('day'), { page, initialTab: 'save', close: () => setTimeout(day, 1600) });
  await day();
  // Keep focus on the page rather than the panel when it first draws.
  document.activeElement?.blur();
  await renderApp(document.getElementById('night'), { page, initialTab: 'find' });
  const q = document.querySelector('#night .q');
  if (q) { q.value = 'colour palette'; q.dispatchEvent(new Event('input')); q.blur(); }
</script>
</body>
</html>
