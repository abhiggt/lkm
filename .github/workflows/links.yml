# Every Monday: check every saved link, mark broken ones with deadSince,
# commit the change, and open an issue listing what broke.
name: Dead link check

on:
  schedule:
    - cron: "17 3 * * 1"   # Monday 08:47 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links
        run: node tools/check-links.mjs --write --report link-report.md
      - name: Commit changes
        run: |
          if ! git diff --quiet data/bookmarks.json; then
            git config user.name "linkmery-bot"
            git config user.email "linkmery-bot@users.noreply.github.com"
            git commit -am "Mark dead links"
            git push
          fi
      - name: Open an issue for broken links
        if: hashFiles('link-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Dead links found $(date +%F)" --body-file link-report.md
